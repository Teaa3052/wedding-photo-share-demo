<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7EF">
  <title>Fotografije</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;1,600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="page">
    <img class="bouquet bouquet-bottom" src="/bouquet-bottom-left.png" alt="" aria-hidden="true">
    <span class="petal petal-1" aria-hidden="true"></span>
    <span class="petal petal-2" aria-hidden="true"></span>
    <span class="petal petal-3" aria-hidden="true"></span>
    <span class="petal petal-4" aria-hidden="true"></span>
    <span class="petal petal-5" aria-hidden="true"></span>
    <span class="petal petal-6" aria-hidden="true"></span>

    <header class="hero">
      <img class="bouquet bouquet-top" src="/bouquet-top-right.png" alt="" aria-hidden="true">
      <div class="hero-inner">
        <p class="couple-names" id="weddingNames">&nbsp;</p>

        <div class="date-divider" aria-hidden="true">
          <span class="line"></span>
          <span class="date-text" id="weddingDate">&nbsp;</span>
          <span class="line"></span>
        </div>

        <h1 class="headline">Podijeli <em>svoje fotografije</em></h1>
        <p class="intro">Svaki trenutak koji uhvatiš postaje dio naše priče.</p>

        <button class="primary hero-cta" id="chooseButton"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.3"/></svg>Dodaj fotografije</button>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
        <div id="uploadStatus" class="status" aria-live="polite"></div>
      </div>
    </header>

    <div class="section-divider" aria-hidden="true">
      <span class="line"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.3 5.3c2.3-1.35 5-.6 6.7 1.4a.9.9 0 0 0 1.4 0c1.7-2 4.4-2.75 6.7-1.4 2.7 1.6 3.3 4.9 1.6 7.6C18.7 16.65 12 21 12 21Z"/></svg>
      <span class="line"></span>
    </div>
    <h2 class="section-title">Vaše uspomene</h2>
    <p class="memories-count" id="memoriesCount"></p>

    <main class="gallery-section">
      <div id="gallery" class="gallery"></div>
      <p id="empty" class="empty hidden">Budi prvi koji će podijeliti uspomenu ♡</p>
      <button class="loadmore hidden" id="loadMoreButton">Učitaj još fotografija</button>
    </main>

    <footer class="outro">
      <p class="thanks hidden" id="thanks">Hvala što dijeliš uspomene! ♡</p>
    </footer>
  </div>

  <button class="fab" id="fabButton" aria-label="Dodaj fotografije">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="viewer" class="viewer">
    <button class="nav prev hidden" id="viewerPrev" aria-label="Prethodna fotografija"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <button class="nav next hidden" id="viewerNext" aria-label="Sljedeća fotografija"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    <button class="close" id="closeViewer" aria-label="Zatvori">×</button>
    <div id="viewerContent"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
